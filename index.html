<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Inventory Asset DPSA</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#07142c;
      color:white;
      min-height:100vh;
      display:center;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:fit-content;
      display:center;
      min-width:900px;
      max-width:1100px;

      background:#13233f;
      border-radius:25px;
      padding:35px;
      border-top:5px solid #2ec3ff;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }

    .asset-image{
      width:250px;
      max-width:250px;
      height:auto;
      object-fit:contain;
      border-radius:15px;
      background:#fff;
    }

    .label{
      color:#94a3b8;
      font-size:12px;
      letter-spacing:3px;
      margin-top:15px;
    }

    .value{
      font-size:20px;
      font-weight:bold;
      margin-top:5px;
      word-break:break-word;
    }

    .asset-code{
      color:#2ec3ff;
    }

    .status{
      display:inline-block;
      width:fit-content;
      margin-top:10px;
      background:#2ec3ff;
      color:black;
      padding:8px 18px;
      border-radius:10px;
      font-weight:bold;
    }

    .error{
      color:#ff6b6b;
      text-align:center;
      font-size:18px;
    }

  body{
    background:#07142c;
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:20px;
  }

  /* TAMBAHKAN DI SINI */

  .container{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.header{
  margin-bottom:30px;
}

.header-content{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.logo{
  width:80px;
  height:80px;
  object-fit:contain;
}

.asset-image{
  width:250px;
  min-width:250px;
  height:450px;
  object-fit:cover;
  border-radius:15px;
}

.asset-layout{
  display:flex;
  flex-direction:row;
  gap:30px;
  align-items:flex-start; /* penting */
}

.asset-info{
  flex:1;
  align-self:flex-start; /* penting */
  padding-top:0;
  margin-top:0;
}

/* Tampilan HP */
@media (max-width: 768px){

  .card{
    width:100%;
    max-width:100%;
    padding:20px;
  }

  .asset-layout{
    display:flex;
    flex-direction:column-reverse;
    gap:20px;
  }

  .asset-image{
    width:100%;
    max-width:100%;
    min-width:0;
    height:auto;
  }

  .asset-info{
    width:100%;
  }

  .value{
    font-size:18px;
  }

}
    
  </style>

</head>

<body>

  <div class="container">
<div class="header">

  <div class="header-content">

    <img
      src="logo dpsa.png"
      class="logo"
      alt="Logo DPSA"
    >

    <div>

      <h1>INVENTORY ASSET DPSA</h1>

      <p>
        Sistem Informasi Inventaris Asset
      </p>

    </div>

  </div>

</div>

  <div class="card" id="card">
    Loading asset...
  </div>

  </div>

  <script>

    const SHEET_ID =
    "1csqVJgZhmLnA0pCo-TQPKNXe2jg-wVijiGuryEfD10o";

    const SHEET_NAME =
    "DATABASE";

    const API_URL =
    `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

    const card =
    document.getElementById("card");

    // ambil kode dari URL 
    const params =
    new URLSearchParams(window.location.search);

    const kode =
    params.get("kode");

    async function loadData(){

      try{

        const response =
        await fetch(API_URL);

        const data =
        await response.json();

        console.log(data);

        if(!data || data.length === 0){

          card.innerHTML =
          `<div class="error">Data kosong</div>`;

          return;
        }

        let asset;

        // kalau scan QR
        if(kode){

          asset = data.find(item =>
            item["Kode Barang"] === kode
          );

        }else{

          // default data pertama
          asset = data[0];
        }

        if(!asset){

          card.innerHTML =
          `<div class="error">Asset tidak ditemukan</div>`;

          return;
        }

        // link gambar dari spreadsheet
        // debug
console.log("Asset:", asset);
console.log("Link Gambar:", asset["Link Gambar"]);

// link gambar
let imageUrl = asset["Link Gambar"] || "";

// jika masih link sharing drive
if(imageUrl.includes("drive.google.com/file/d/")){

  const match = imageUrl.match(/\/d\/([^\/]+)/);

  if(match){

    const fileId = match[1];

    imageUrl =
    `https://drive.google.com/thumbnail?id=${fileId}&sz=w2000`;
  }
}

card.innerHTML = `

<div class="asset-layout">

  <img
    class="asset-image"
    src="${imageUrl}"
    alt="Asset Image"
    onerror="this.src='https://via.placeholder.com/400x250?text=No+Image'"
  >

  <div class="asset-info">

    <div class="label">Nama Barang</div>
    <div class="value">${asset["Nama Barang"] || "-"}</div>

    <div class="label">Kode Barang</div>
    <div class="value asset-code">${asset["Kode Barang"] || "-"}</div>

    <div class="label">Tipe / Ukuran</div>
    <div class="value">${asset["Tipe/Ukuran"] || "-"}</div>

    <div class="label">Lokasi</div>
    <div class="value">${asset["Lokasi"] || "-"}</div>

    <div class="label">Keterangan</div>
    <div class="value">${asset["Keterangan (Letak)"] || "-"}</div>

    <div class="label">Kondisi Asset</div>
    <div class="status">${asset["Kondisi Aset"] || "-"}</div>

  </div>

</div>

`;
      }catch(error){

        console.log(error);

        card.innerHTML =
        `<div class="error">
          ERROR mengambil data
        </div>`;
      }
    }

    loadData();

  </script>

</body>
</html>
